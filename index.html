<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sofiia Matsiutsia — Designs for products & services</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">

  <header class="header">
    <nav class="nav" aria-label="Primary">
      <a href="#about" class="nav__link">About,</a>
      <a href="#work" class="nav__link">Work,</a>
      <a href="#talks" class="nav__link">Talks.</a>
    </nav>

    <a href="#top" class="logo" aria-label="Sofiia Matsiutsia — home">
      <img src="assets/images/logo.gif" alt="Sofiia Matsiutsia" class="logo__mark" />
    </a>

    <button type="button" class="sound-toggle" aria-label="Mute" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
        <path class="sound-toggle__wave sound-toggle__wave--outer" stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728" />
        <path class="sound-toggle__wave sound-toggle__wave--inner" stroke-linecap="round" stroke-linejoin="round" d="M16.463 8.288a5.25 5.25 0 0 1 0 7.424" />
        <path class="sound-toggle__mute-arm sound-toggle__mute-arm--a" stroke-linecap="round" d="M17.25 9.75 21.75 14.25" />
        <path class="sound-toggle__mute-arm sound-toggle__mute-arm--b" stroke-linecap="round" d="M21.75 9.75 17.25 14.25" />
      </svg>
    </button>
  </header>

  <section class="hero">
    <h1 class="hero__heading">
      <span class="hero__doodle-target">
        <img src="assets/icons/doodle-circle.svg" alt="" class="hero__doodle" />
        i do design for
      </span>
      <img src="assets/images/word-products.svg" alt="products" class="hero__word" />,
      <img src="assets/images/word-services.svg" alt="services" class="hero__word" />,
      and run
      <img src="assets/images/word-ai-community.svg" alt="AI community" class="hero__word" />.
    </h1>

    <p class="hero__heading">
      but also research, tinker, and design engineering.<br />
      based in london.
    </p>

    <div class="actions">
      <button type="button" class="action-btn">Copy email</button>
      <a href="#" class="action-btn">LinkedIn</a>
      <a href="#" class="action-btn">Twitter</a>
    </div>
  </section>

  <div class="spacer" aria-hidden="true"></div>

  <section class="marquee" aria-label="Selected projects">
    <div class="marquee__track">

      <article class="card card--wide">
        <div class="card__media card__media--voyage">
          <img src="assets/images/voyage-monitor.png" alt="Voyage Monitor product screenshot" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>voyage monitor</p>
      </article>

      <article class="card card--square">
        <div class="card__media card__media--skills">
          <img src="assets/images/skills-trade.png" alt="Skills Trade product screenshot" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>skills trade</p>
      </article>

      <article class="card card--square">
        <div class="card__media card__media--realestate">
          <img src="assets/images/real-estate.png" alt="Real Estate product screenshot" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>real estate 1</p>
      </article>

      <article class="card card--wide" aria-hidden="true">
        <div class="card__media card__media--voyage">
          <img src="assets/images/voyage-monitor.png" alt="" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>voyage monitor</p>
      </article>

      <article class="card card--square" aria-hidden="true">
        <div class="card__media card__media--skills">
          <img src="assets/images/skills-trade.png" alt="" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>skills trade</p>
      </article>

      <article class="card card--square" aria-hidden="true">
        <div class="card__media card__media--realestate">
          <img src="assets/images/real-estate.png" alt="" />
        </div>
        <p class="card__label"><span class="card__dot">.</span>real estate 1</p>
      </article>

    </div>
  </section>

  <button type="button" class="menu-bar" id="menu-open" aria-haspopup="true" aria-controls="menu-overlay" aria-expanded="false">
    Menu
  </button>

</div>

<div class="menu-overlay" id="menu-overlay" hidden>
  <a href="#top" class="logo" aria-label="Sofiia Matsiutsia — home">
    <img src="assets/images/logo.gif" alt="Sofiia Matsiutsia" class="logo__mark" />
  </a>

  <nav class="menu-overlay__nav" aria-label="Primary">
    <a href="#about" class="menu-overlay__link">About</a>
    <a href="#work" class="menu-overlay__link">Work</a>
    <a href="#talks" class="menu-overlay__link">talks</a>
  </nav>

  <div class="actions actions--full">
    <button type="button" class="action-btn">Copy email</button>
    <a href="#" class="action-btn">LinkedIn</a>
    <a href="#" class="action-btn">Twitter</a>
  </div>

  <button type="button" class="menu-bar" id="menu-close" aria-controls="menu-overlay">
    Close
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
