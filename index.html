<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sofiia Matsiutsia — Designs for products & services</title>
<link rel="stylesheet" href="styles.css?v=84" />
</head>
<body class="home">
<div class="page home-page" id="top">

  <header class="header">
    <a href="#top" class="logo" aria-label="Sofiia Matsiutsia — home">
      <img src="assets/images/sm-logo.svg" alt="Sofiia Matsiutsia" class="logo__mark" />
    </a>

    <nav class="nav" aria-label="Primary">
      <a class="nav__link nav__link--about" data-cursor="soon">
        <span class="nav__label">About</span>
        <span class="nav__mark" aria-hidden="true">
          <img class="nav__mark-img nav__mark-img--hover" src="assets/icons/about-hover.svg" alt="" width="70" height="28" />
          <img class="nav__mark-img nav__mark-img--selected" src="assets/icons/about-hover.svg" alt="" width="70" height="28" />
        </span>
      </a>
      <a href="work.html" class="nav__link nav__link--work">
        <span class="nav__label">Work</span>
        <span class="nav__mark" aria-hidden="true">
          <img class="nav__mark-img nav__mark-img--hover" src="assets/icons/work-hover.svg" alt="" width="63" height="28" />
          <img class="nav__mark-img nav__mark-img--selected" src="assets/icons/work-hover.svg" alt="" width="63" height="28" />
        </span>
      </a>
      <a class="nav__link nav__link--writings" data-cursor="soon">
        <span class="nav__label">Writings</span>
        <span class="nav__mark" aria-hidden="true">
          <img class="nav__mark-img nav__mark-img--hover" src="assets/icons/writings-hover.svg" alt="" width="99" height="28" />
          <img class="nav__mark-img nav__mark-img--selected" src="assets/icons/writings-hover.svg" alt="" width="99" height="28" />
        </span>
      </a>
      <a class="nav__link nav__link--talks" data-cursor="soon">
        <span class="nav__label">Talks</span>
        <span class="nav__mark" aria-hidden="true">
          <img class="nav__mark-img nav__mark-img--hover" src="assets/icons/talks-hover.svg" alt="" width="63" height="28" />
          <img class="nav__mark-img nav__mark-img--selected" src="assets/icons/talks-hover.svg" alt="" width="63" height="28" />
        </span>
      </a>
    </nav>

    <button type="button" class="sound-toggle" aria-label="Mute sound" aria-pressed="false">
      <span class="sound-toggle__swap">
        <span class="sound-toggle__layer sound-toggle__layer--on">
          <img src="assets/icons/audio-on.svg" alt="" class="sound-toggle__icon" aria-hidden="true" />
        </span>
        <span class="sound-toggle__layer sound-toggle__layer--off">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="sound-toggle__icon" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
          </svg>
        </span>
      </span>
    </button>
  </header>

  <main class="home-main">
    <section class="hero" aria-labelledby="home-intro">
      <h1 class="hero__heading" id="home-intro">
        London-based <span class="hero__accent">product designer</span> specializing in human-AI interaction and complex workflows.
      </h1>
      <p class="hero__heading">Tech <span class="hero__accent">community</span> founder.</p>
    </section>

    <div class="actions">
      <button type="button" class="action-btn action-btn--copy">
        <span class="action-btn__width" aria-hidden="true">Copy email</span>
        <span class="action-btn__text">Copy email</span>
      </button>
      <a href="https://www.linkedin.com/in/smatsiutsia/" class="action-btn" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span>
        <img src="assets/icons/new-window-arrow-1.svg" alt="" class="action-btn__arrow" aria-hidden="true" />
      </a>
      <a href="https://x.com/SMatsiutsia" class="action-btn" target="_blank" rel="noopener noreferrer">
        <span>Twitter</span>
        <img src="assets/icons/new-window-arrow-2.svg" alt="" class="action-btn__arrow" aria-hidden="true" />
      </a>
    </div>

    <section class="showcase" aria-label="Selected work. Drag, scroll, or use arrow keys to browse." tabindex="0">
      <div class="showcase__track">
        <div class="showcase__group">
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--four-three">
              <img src="assets/images/showcase/90poe-animation.gif" alt="Voyage Monitor dashboard animation" decoding="async" />
            </div>
          </div>
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--ha">
              <img src="assets/images/showcase/ha-2.png" alt="Housing Anywhere internal settlements panel" decoding="async" />
            </div>
          </div>
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--mft">
              <video autoplay loop muted playsinline preload="metadata" aria-label="MFT project animation">
                <source src="assets/images/showcase/mft.mp4" type="video/mp4" />
              </video>
            </div>
          </div>
          <div class="showcase__row showcase__row--double">
            <div class="showcase__item showcase__item--portrait">
              <img src="assets/images/showcase/ha-mobile-animation.gif" alt="Housing Anywhere mobile homepage animation" decoding="async" />
            </div>
            <div class="showcase__item showcase__item--portrait">
              <img src="assets/images/showcase/ha-scroll-animation.gif" alt="Housing Anywhere apartment page animation" decoding="async" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <button type="button" class="menu-bar" id="menu-open" aria-haspopup="true" aria-controls="menu-overlay" aria-expanded="false">
    Menu
  </button>

</div>

<div class="menu-overlay" id="menu-overlay" hidden>
  <a href="#top" class="menu-overlay__logo" aria-label="Sofiia Matsiutsia — home">
    <img src="assets/images/sm-logo.svg" alt="Sofiia Matsiutsia" width="230" height="29" />
  </a>

  <div class="ring-stage" aria-hidden="true">
    <div class="ring ring--cover"></div>
    <div class="ring ring--about"></div>
    <div class="ring ring--works"></div>
    <div class="ring ring--writings"></div>
    <div class="ring ring--talks"></div>
    <div class="ring ring--core"></div>
  </div>

  <nav class="menu-overlay__nav" aria-label="Primary">
    <a class="menu-overlay__link menu-overlay__link--about" data-cursor="soon"><span>About</span></a>
    <a href="work.html" class="menu-overlay__link menu-overlay__link--work"><span>Works</span></a>
    <a class="menu-overlay__link menu-overlay__link--writings" data-cursor="soon"><span>Writings</span></a>
    <a class="menu-overlay__link menu-overlay__link--talks" data-cursor="soon"><span>Talks</span></a>
  </nav>

  <div class="menu-overlay__contact">
    <button type="button" class="menu-overlay__contact-link menu-overlay__contact-link--email">
      <span class="menu-overlay__contact-width" aria-hidden="true">Copy email</span>
      <span class="menu-overlay__contact-text">Copy email</span>
    </button>
    <div class="menu-overlay__contact-row">
      <a href="https://www.linkedin.com/in/smatsiutsia/" class="menu-overlay__contact-link menu-overlay__contact-link--linkedin" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span>
        <img src="assets/icons/new-window-arrow-1.svg" alt="" class="menu-overlay__contact-arrow" aria-hidden="true" />
      </a>
      <a href="https://x.com/SMatsiutsia" class="menu-overlay__contact-link menu-overlay__contact-link--twitter" target="_blank" rel="noopener noreferrer">
        <span>Twitter</span>
        <img src="assets/icons/new-window-arrow-2.svg" alt="" class="menu-overlay__contact-arrow" aria-hidden="true" />
      </a>
    </div>
  </div>

  <button type="button" class="menu-bar menu-overlay__close" id="menu-close" aria-controls="menu-overlay">
    Close
  </button>
</div>

<script src="script.js?v=46"></script>
</body>
</html>
