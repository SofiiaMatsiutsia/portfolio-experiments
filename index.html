  <main class="home-main">
    <section class="hero" aria-labelledby="home-intro">
      <h1 class="hero__heading" id="home-intro">
        London-based <span class="hero__accent">product designer</span> specializing in human-AI interaction and complex workflows.
      </h1>
      <p class="hero__heading">Tech <span class="hero__accent">community</span> founder.</p>
    </section>

    <div class="actions">
      <button type="button" class="action-btn action-btn--copy">
        <span class="action-btn__width" aria-hidden="true">Copy email</span>
        <span class="action-btn__text">Copy email</span>
      </button>
      <a href="https://www.linkedin.com/in/smatsiutsia/" class="action-btn" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span>
        <img src="assets/icons/new-window-arrow-1.svg" alt="" class="action-btn__arrow" aria-hidden="true" />
      </a>
      <a href="https://x.com/SMatsiutsia" class="action-btn" target="_blank" rel="noopener noreferrer">
        <span>Twitter</span>
        <img src="assets/icons/new-window-arrow-2.svg" alt="" class="action-btn__arrow" aria-hidden="true" />
      </a>
    </div>

    <section class="showcase" aria-label="Selected work. Drag, scroll, or use arrow keys to browse." tabindex="0">
      <div class="showcase__track">
        <div class="showcase__group">
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--four-three">
              <img src="assets/images/showcase/90poe-animation.gif" alt="Voyage Monitor dashboard animation" decoding="async" />
            </div>
          </div>
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--ha">
              <img src="assets/images/showcase/ha-2.png" alt="Housing Anywhere internal settlements panel" decoding="async" />
            </div>
          </div>
          <div class="showcase__row showcase__row--single">
            <div class="showcase__item showcase__item--mft">
              <video autoplay loop muted playsinline preload="metadata" aria-label="MFT project animation">
                <source src="assets/images/showcase/mft.mp4" type="video/mp4" />
              </video>
            </div>
          </div>
          <div class="showcase__row showcase__row--double">
            <div class="showcase__item showcase__item--portrait">
              <img src="assets/images/showcase/ha-mobile-animation.gif" alt="Housing Anywhere mobile homepage animation" decoding="async" />
            </div>
            <div class="showcase__item showcase__item--portrait">
              <img src="assets/images/showcase/ha-scroll-animation.gif" alt="Housing Anywhere apartment page animation" decoding="async" />
            </div>
          </div>
        </div>
      </div>
    </section>
